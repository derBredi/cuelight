# CueLight - alles, was nötig ist, steht in dieser einen Datei.
#
#   docker compose up -d
#
# In Portainer: "Stacks" -> "Add stack" -> diesen Text einfügen,
# die beiden Werte unten eintragen, "Deploy".

services:
  cuelight:
    image: ghcr.io/derbredi/cuelight:latest
    container_name: cuelight
    restart: unless-stopped
    environment:
      # Aus der eigenen Zoom-App: Marketplace -> Develop -> Build App ->
      # General App -> "App Credentials". Beide Werte stehen dort direkt
      # untereinander (siehe README, Schritt 1).
      ZOOM_CLIENT_ID: "hier_eintragen"
      ZOOM_CLIENT_SECRET: "hier_eintragen"

      # Passwort für die Seite. Nötig, sobald CueLight aus dem Internet
      # erreichbar ist. Leer lassen, wenn schon eine eigene
      # Zugriffskontrolle davor hängt (z. B. Cloudflare Access).
      CUELIGHT_PASSWORD: ""
    volumes:
      # Hier merkt sich CueLight die einmalige Zoom-Freigabe.
      - ./data:/app/data
    ports:
      # Nur lokal gebunden: Davor gehört zwingend etwas, das HTTPS
      # bereitstellt - ein Cloudflare Tunnel oder ein Reverse-Proxy. Über
      # eine unverschlüsselte Adresse verweigert Zoom den Beitritt, ein für
      # alle offener Port hätte also gar keinen Nutzen (siehe README).
      - "127.0.0.1:4000:4000"
