# CueLight - die Stack-Datei. Hier ist NICHTS einzutragen.
#
#   cp .env.example .env     # einmalig: Zugangsdaten hinein
#   docker compose up -d
#
# WARUM HIER NICHTS MEHR STEHT: Frueher standen die Zugangsdaten direkt in
# dieser Datei. Das funktioniert - bis jemand sie neu herunterlaedt, um
# eine neue Fassung zu bekommen. Dann sind die eigenen Werte weg, und zwar
# ohne Vorwarnung. Seit sie in der .env stehen, laesst sich diese Datei
# jederzeit gefahrlos ersetzen.
#
# IN PORTAINER: "Stacks" -> "Add stack" -> diesen Text einfuegen, unten
# unter "Environment variables" dieselben Namen wie in der .env.example
# eintragen, "Deploy". Auch dort ist an diesem Text nichts zu aendern.

services:
  cuelight:
    # FESTE FASSUNG, kein "latest".
    #
    # Mit "latest" zieht ein "docker compose pull" am Vorabend einer
    # Veranstaltung, was zuletzt veroeffentlicht wurde - ohne dass jemand
    # das entschieden haette. Eine Nummer hier heisst: Es aendert sich
    # genau dann etwas, wenn du diese Zeile aenderst.
    #
    # Aktualisieren:  Zeile anpassen, dann
    #                 docker compose pull && docker compose up -d
    # Welche Fassungen es gibt: github.com/derBredi/cuelight/releases
    image: ghcr.io/derbredi/cuelight:1.3.9
    container_name: cuelight
    restart: unless-stopped

    # Die Werte kommen aus der .env-Datei daneben (oder, in Portainer, aus
    # dem Feld "Environment variables").
    #
    # Das ":?" bei den beiden Pflichtangaben ist Absicht: Fehlen sie,
    # bricht "docker compose up" sofort mit genau diesem Satz ab, statt
    # einen Container zu starten, der erst beim Beitritt scheitert.
    environment:
      ZOOM_CLIENT_ID: ${ZOOM_CLIENT_ID:?In der .env eintragen - siehe .env.example}
      ZOOM_CLIENT_SECRET: ${ZOOM_CLIENT_SECRET:?In der .env eintragen - siehe .env.example}
      CUELIGHT_PASSWORD: ${CUELIGHT_PASSWORD:-}
      CUELIGHT_ADMIN_PASSWORD: ${CUELIGHT_ADMIN_PASSWORD:-}
      CUELIGHT_TRUST_PROXY: ${CUELIGHT_TRUST_PROXY:-}
      CUELIGHT_ENABLE_CSP: ${CUELIGHT_ENABLE_CSP:-}

    volumes:
      # Hier merkt sich CueLight die einmalige Zoom-Freigabe. Das
      # Entrypoint-Skript korrigiert die Rechte beim Start selbst, ein
      # "chown" von Hand ist nicht noetig.
      - ./data:/app/data

    ports:
      # Nur lokal gebunden: Davor gehoert zwingend etwas, das HTTPS
      # bereitstellt - ein Cloudflare Tunnel oder ein Reverse-Proxy. Ueber
      # eine unverschluesselte Adresse verweigert Zoom den Beitritt, ein
      # fuer alle offener Port haette also gar keinen Nutzen (siehe README).
      - "127.0.0.1:4000:4000"
