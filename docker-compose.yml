# Zieht das fertige, automatisch veröffentlichte Image.
#
#   cp .env.example .env    # und dort die Werte eintragen
#   docker compose up -d

services:
  cuelight:
    image: ghcr.io/derbredi/cuelight:latest
    container_name: cuelight
    restart: unless-stopped
    # Zugangsdaten stehen in der .env-Datei daneben, nicht in dieser Datei -
    # so landen sie nicht versehentlich in einem Commit und tauchen auch
    # nicht in "docker inspect" oder der Portainer-Oberfläche als Klartext
    # in der Stack-Definition auf.
    env_file:
      - .env
    volumes:
      # Container regelt die Zugriffsrechte hierfür selbst beim Start -
      # kein manuelles chown auf dem Host nötig.
      - ./data:/app/data
    ports:
      # Nur lokal gebunden: davor gehört ein Reverse-Proxy (cloudflared,
      # nginx, Caddy). Für einen reinen Test im LAN "127.0.0.1:" entfernen.
      - "127.0.0.1:4000:4000"
