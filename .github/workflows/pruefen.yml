# Prueft bei JEDEM Push. Baut und veroeffentlicht NICHTS.
#
# WARUM GETRENNT VON publish.yml: Der dortige Rauchtest ist gut, laeuft
# aber nur beim Setzen eines Tags - also genau dann, wenn die Entscheidung
# zum Ausliefern schon gefallen ist. Ein Fehler faellt dort zum
# spaetestmoeglichen Zeitpunkt auf.
#
# Dieser Lauf hat keine Rechte ausser Lesen und beruehrt die Registry
# nicht. Er kann also nichts ausliefern, auch nicht aus Versehen.

name: Pruefen

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # EIN Paket, und zwar nur fuer die Tests.
      #
      # oberflaeche-verhalten.test.js laedt public/index.html wirklich und
      # fuehrt ihr Skript aus; dafuer braucht es einen DOM. Es steht
      # bewusst nicht in den dependencies: Die Anwendung selbst benutzt es
      # nie, und "npm ci --omit=dev" im Dockerfile wuerde es ohnehin nicht
      # mitnehmen. Mit --no-save bleibt auch package.json unberuehrt.
      #
      # Die vier Abhaengigkeiten des Servers werden weiterhin NICHT
      # geholt: Die uebrigen Tests pruefen eigene Rechnungen und kommen
      # ohne sie aus.
      - name: jsdom fuer die Dauer des Laufs
        run: npm install --no-save jsdom

      - name: Tests
        run: npm test

      # Syntaxpruefung fuer alles, was die Tests nicht anfassen. server.js
      # laedt Express und laesst sich hier nicht ausfuehren - aber ob der
      # Text als JavaScript durchgeht, sagt "node --check" auch ohne
      # Abhaengigkeiten.
      - name: Syntax
        run: |
          for f in server.js lib/*.js tools/*.js; do
            [ -e "$f" ] || continue
            node --check "$f" && echo "ok: $f"
          done
