# Baut das Docker-Image automatisch und veröffentlicht es in GitHub
# Container Registry (ghcr.io), sobald ein Versions-Tag gepusht wird.
#
# Neue Version veröffentlichen:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Ergebnis landet unter:
#   ghcr.io/derbredi/cuelight:v1.0.0
#   ghcr.io/derbredi/cuelight:latest
#
# Kein zusätzliches Secret nötig - GITHUB_TOKEN wird automatisch von
# GitHub Actions bereitgestellt und darf dank "permissions: packages: write"
# unten in die eigene Container Registry schreiben.

name: Docker-Image veröffentlichen

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # erlaubt auch manuelles Auslösen über die GitHub-Oberfläche

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: QEMU einrichten (für Multi-Arch-Build)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Tags/Labels ableiten
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            # "latest" nur für echte Releases - ein Tag wie v1.2.0-rc1
            # soll nicht bei allen Nutzern automatisch mitgezogen werden.
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Bauen und veröffentlichen (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
